.logo{display:block;flex:none;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.bl{display:flex;align-items:center;gap:2px;min-width:0}
.bl .brand{padding:0;font-size:28px;white-space:nowrap}
.bl .logo{width:40px;height:40px;color:var(--sbi)}
.mbrand .logo{width:34px;height:34px;color:var(--hl)}
*{box-sizing:border-box}
body,main,.bub,.box,.q,.seg{transition:background-color .3s var(--ease),border-color .2s var(--ease),color .3s var(--ease)}
.new,.h,.pill,.seg button,.bgs,.bgm,.send,.refresh,.x,.sq{transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),filter .2s var(--ease),opacity .2s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.msg.in{animation:in .4s var(--ease)}
.q{animation:in .45s var(--ease) both}
.q:nth-child(2){animation-delay:.06s}.q:nth-child(3){animation-delay:.12s}
.app.collapsed .mbrand,.app.collapsed #burger{animation:fade .35s var(--ease) .1s both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{display:flex;height:100%}
aside{width:284px;flex:none;background:var(--sb);color:var(--sbi);display:flex;flex-direction:column;padding:26px 16px 16px;gap:12px;transition:transform .32s var(--ease),margin-left .32s var(--ease),background-color .3s var(--ease)}
.brand{font-family:var(--ser);font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.1;padding:0 6px}
.tag{font-size:13px;color:var(--sbm);padding:0 6px 10px}
.new{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;background:var(--gold);color:var(--goldink);font-size:14px;font-weight:700;text-align:left}
.new:hover{filter:brightness(1.08)}
.lbl{font-size:12px;color:var(--sbm);padding:14px 6px 2px;text-transform:uppercase;letter-spacing:.06em}
.sq{width:100%;padding:9px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:var(--sbi);font:inherit;font-size:13.5px;outline:0}
.sq::placeholder{color:var(--sbm)}
.sq:focus{border-color:var(--sbm)}
#hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;font-size:14px;width:100%;cursor:pointer}
.h .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.acts{display:none;gap:2px;flex:none}
.h:hover .acts{display:flex}
.h .ed{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);border-radius:6px;color:var(--sbi);font:inherit;font-size:14px;padding:3px 6px;outline:0}
.h:hover,.h.on{background:var(--sbh)}
.h.on{box-shadow:inset 3px 0 0 var(--gold)}
.h .x{font-size:12px;color:var(--sbm);padding:2px 4px}
.h .x:hover{color:var(--sbi)}.h .x[data-del]:hover{color:#f2a198}
@media (hover:none){.h .acts{display:flex}}
.empty{font-size:13px;color:var(--sbm);padding:8px 10px}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{border:1px solid var(--line);background:var(--sf);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pill:hover{border-color:var(--navy)}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sf)}
.seg button{padding:6px 13px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--navy);color:var(--on)}
.menu{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--sf)}
.menu:hover{border-color:var(--navy)}
.sbhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bgs,.bgm{width:38px;height:38px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:8px}
.bgs i,.bgm i{display:block;width:18px;height:2px;border-radius:2px;background:currentColor}
.bgs{color:var(--sbi)}.bgs:hover{background:var(--sbh)}
.bgm{color:var(--ink);border:1px solid var(--line);background:var(--sf)}.bgm:hover{border-color:var(--navy)}
#burger{display:none}
.mbrand{display:none;align-items:center;gap:3px;font-family:var(--ser);font-size:22px;font-weight:700}
@media (min-width:761px){.app.collapsed aside{margin-left:-284px}.app.collapsed .mbrand{display:flex}.app.collapsed #burger{display:flex}}
#scroll{flex:1;overflow:auto;padding:0 24px}
.wrap{max-width:780px;margin:0 auto;width:100%;container-type:inline-size}
.hero{padding:9vh 0 10px}
.hero h1{margin:0;font-family:var(--ser);font-size:clamp(30px,5vw,44px);line-height:1.15;font-weight:600;letter-spacing:-.01em}
.hero h1 .n{color:var(--hl)}
.hero p{color:var(--mut);margin:14px 0 22px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:stretch}
@container (max-width:620px){.grid{grid-template-columns:1fr}}
.q{display:flex;align-items:flex-start;justify-content:flex-start;background:var(--warm);border:1px solid var(--warmline);border-radius:12px;padding:16px 18px;text-align:left;font-size:14px;line-height:1.55;min-height:96px;color:var(--ink);text-wrap:pretty}
.q:hover{border-color:var(--warmhov)}
.q span{flex:1;min-width:0;text-align:justify;text-align-last:left;text-justify:inter-word}
.refresh{margin:16px 0;font-size:13px;color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.refresh:hover{color:var(--acc)}
.msg{display:flex;margin:20px 0}
.msg.u{justify-content:flex-end}
.bub{padding:12px 16px;border-radius:14px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.b .bub.fit{width:auto;max-width:100%}
.u .bub{max-width:86%;background:var(--user);color:#fff;border-bottom-right-radius:4px}
.b .bub{width:100%;background:var(--sf);border:1px solid var(--line);border-bottom-left-radius:4px;border-left:3px solid var(--gold2);padding:16px 20px}
sup.c{color:var(--acc);font-weight:700;margin-left:2px}
.src{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);white-space:normal}
.src div{margin-top:4px}
.src a{color:var(--acc);text-decoration:none;font-weight:600}.src a:hover{text-decoration:underline}
#typing .bub{width:auto;padding:11px 16px;display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13.5px}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:b 1.3s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.comp{padding:8px 24px 16px}
.box{max-width:780px;margin:0 auto;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px 18px}
.box:focus-within{border-color:var(--navy)}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:15px;color:var(--ink);min-height:48px;max-height:160px;line-height:1.5;padding:0}
textarea::placeholder{color:var(--mut)}
.row{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}
.hint{font-size:12.5px;color:var(--mut);margin-right:auto}
.send{background:var(--navy);color:var(--on);width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.send:disabled{opacity:.45;cursor:default}
.note{max-width:780px;margin:10px auto 0;text-align:center;font-size:12px;color:var(--mut)}
.mask{display:none}
@media (max-width:760px){
 aside{position:fixed;z-index:20;left:0;top:0;bottom:0;transform:translateX(-100%);padding-top:calc(26px + env(safe-area-inset-top,0px))}
 aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
 .mask{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
 .mask.open{opacity:1;pointer-events:auto}
 .top{justify-content:space-between;padding:12px 16px}
 #burger{display:flex}
 .mbrand{display:flex;font-family:var(--ser);font-size:22px;font-weight:700}
 #scroll,.comp{padding-left:16px;padding-right:16px}
 .hero{padding-top:4vh}
 .hint{display:none}
}
</style>
</head>

var API_URL = "https://opphunter.onrender.com/chat";

var T = {
 vi:{new:"Cuộc trò chuyện mới",history:"Lịch sử",none:"Chưa có cuộc trò chuyện nào",hi:"Chào bạn,",ask:"Bạn muốn tìm học bổng nào?",sub:"Chọn một gợi ý bên dưới hoặc tự đặt câu hỏi của bạn.",refresh:"Làm mới gợi ý",ph:"Hỏi bất cứ điều gì về học bổng…",note:"Thông tin chỉ mang tính tham khảo. Hãy kiểm tra trên trang chính thức trước khi nộp hồ sơ.",err:"Không kết nối được máy chủ. Bạn thử lại sau ít phút nhé.",untitled:"Cuộc trò chuyện mới",busy:"Bạn hỏi hơi nhanh hoặc hệ thống đang quá tải, vui lòng thử lại sau ít phút.",srcl:"Nguồn",tag:"Trợ lý tìm kiếm học bổng",del:"Xóa",send:"Gửi",hint:"Enter để gửi · Shift + Enter xuống dòng",menu:"Menu",dark:"Chế độ tối",light:"Chế độ sáng",find:"Tìm trong lịch sử",nores:"Không tìm thấy",thinking:"Đang tìm trong dữ liệu học bổng…",ren:"Đổi tên"},
 en:{new:"New chat",history:"History",none:"No conversations yet",hi:"Hi there,",ask:"What scholarship are you looking for?",sub:"Pick a suggestion below or ask your own question.",refresh:"Refresh prompts",ph:"Ask anything about scholarships…",note:"For reference only. Always verify details on the official website before applying.",err:"Couldn’t reach the server. Please try again in a few minutes.",untitled:"New chat",busy:"You’re asking too fast or the system is busy. Please try again in a few minutes.",srcl:"Sources",tag:"Scholarship search assistant",del:"Delete",send:"Send",hint:"Enter to send · Shift + Enter for a new line",menu:"Menu",dark:"Dark mode",light:"Light mode",find:"Search history",nores:"No matches",thinking:"Searching the scholarship database…",ren:"Rename"}
};
var P = [
 {vi:"Hạn nộp học bổng Aalto University Excellence 2027 là khi nào và xem thông tin chính thức ở đâu?",en:"What is the application deadline for the Aalto University Excellence Scholarship 2027, and where can I find the official application information?"},
 {vi:"Đại học Leeds có học bổng nào cho sinh viên quốc tế bậc đại học không, giá trị bao nhiêu?",en:"Is there any scholarship for international undergraduates at Leeds, and how much is it?"},
 {vi:"Điều kiện nhận học bổng Exeter Undergraduate Scholarship for Vietnam 2027/28 là gì và hạn nộp khi nào?",en:"What are the eligibility conditions and the deadline for the University of Exeter Undergraduate Scholarship for Vietnam 2027/28?"},
 {vi:"Hạn nộp học bổng Reach Oxford là khi nào?",en:"When is the Oxford Reach scholarship deadline?"},
 {vi:"Sinh viên Việt Nam có nhận được học bổng York International Undergraduate 2027/28 không, hạn nộp khi nào?",en:"Can Vietnamese applicants receive the York International Undergraduate Scholarship 2027/28, and what is the deadline?"},
 {vi:"Học bổng giảm học phí của APU giảm được bao nhiêu phần trăm học phí?",en:"What percentage of tuition fees can the APU Tuition Reduction Scholarship cover?"},
 {vi:"Tôi cần chuẩn bị những giấy tờ gì để xin học bổng Aalto?",en:"What documents do I need for the Aalto scholarship?"},
 {vi:"Hạn nộp và mức hỗ trợ tối đa năm đầu của Swansea International Excellence Scholarship năm 2027 là bao nhiêu?",en:"What is the deadline and maximum first-year award for Swansea’s International Excellence Scholarship for 2027 entry?"},
 {vi:"Hạn nộp học bổng Think Big 2027 của Đại học Bristol là khi nào, và có cần mã đăng ký khóa học trước khi nộp không?",en:"When is the deadline for the Think Big Scholarship 2027 at Bristol, and do I need a course application ID before applying?"}
];
var lang = "vi", chats = [], cur = null, busy = false, pOff = 0, animFrom = 1e9;
var $ = function(id){return document.getElementById(id)};
function load(){try{chats=JSON.parse(localStorage.getItem("oh_chats")||"[]");lang=localStorage.getItem("oh_lang")||lang;var th=localStorage.getItem("oh_theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}}
function save(){try{localStorage.setItem("oh_chats",JSON.stringify(chats.slice(0,40)));localStorage.setItem("oh_lang",lang)}catch(e){}}
function localMask(x){return String(x).replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g,"<EMAIL>").replace(/\+?\d[\d\s().-]{7,}\d/g,"<PHONE>")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")}
function t(k){return T[lang][k]}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
 $("inp").placeholder=t("ph");$("sq").placeholder=t("find");$("lvi").classList.toggle("on",lang==="vi");$("len").classList.toggle("on",lang==="en");thLabel();
 renderHist();renderChat();
}
function renderHist(){
 var h=$("hist");
 if(!chats.length){h.innerHTML='<div class="empty">'+esc(t("none"))+'</div>';return}
 var qq=norm($("sq").value.trim()),list=qq?chats.filter(function(c){return norm((c.title||"")+" "+c.msgs.map(function(m){return m.text||""}).join(" ")).indexOf(qq)>-1}):chats;
 if(!list.length){h.innerHTML='<div class="empty">'+esc(t("nores"))+'</div>';return}
 h.innerHTML=list.map(function(c){return '<div class="h'+(c.id===cur?' on':'')+'" data-id="'+c.id+'" role="button" tabindex="0"><span class="tt">'+esc(c.title||t("untitled"))+'</span><span class="acts"><button class="x" data-ren="'+c.id+'">'+esc(t("ren"))+'</button><button class="x" data-del="'+c.id+'">'+esc(t("del"))+'</button></span></div>'}).join("");
}
function fmt(txt,src){
 var h=esc(txt);
 return h.replace(/\s*\[c:([^\]]+)\]/g,function(_,id){var d=id.split("#")[0],i=-1;src.forEach(function(s,k){if(s.id===d)i=k});return i<0?"":'<sup class="c">['+(i+1)+']</sup>'});
}
function srcHTML(src){
 if(!src||!src.length)return "";
 return '<div class="src">'+esc(t("srcl"))+':'+src.map(function(s,i){var l=/^https?:\/\//.test(s.link||"")?'<a href="'+esc(s.link)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+' ↗</a>':esc(s.title);return '<div>['+(i+1)+'] '+l+'</div>'}).join("")+'</div>';
}
function msgHTML(m,i){
 if(m.role==="user")return '<div class="msg u'+(i>=animFrom?' in':'')+'"><div class="bub">'+esc(m.text)+'</div></div>';
 var txt=m.key?(t(m.key)||""):m.text;
 if(!txt)return "";
 return '<div class="msg b'+(i>=animFrom?' in':'')+'"><div class="bub'+(m.key?' fit':'')+'">'+(m.src?fmt(txt,m.src):esc(txt))+srcHTML(m.src)+'</div></div>';
}
function renderChat(){
 var c=chats.filter(function(x){return x.id===cur})[0],h="";
 if(!c||!c.msgs.length){
  var ps=[0,1,2].map(function(i){return P[(pOff+i)%P.length]});
  h='<div class="hero"><h1>'+t("hi")+'<br><span class="n">'+t("ask")+'</span></h1><p>'+t("sub")+'</p><div class="grid">'+ps.map(function(p){return '<button class="q" data-q="'+esc(p[lang])+'"><span>'+esc(p[lang])+'</span></button>'}).join("")+'</div><button class="refresh" id="ref">'+t("refresh")+'</button></div>';
 }else h=c.msgs.map(msgHTML).join("");
 $("chat").innerHTML=h;
 var sc=$("scroll"),sm=animFrom<1e9;animFrom=1e9;sc.scrollTo({top:sc.scrollHeight,behavior:sm?"smooth":"auto"});
}
function ask(q){
 q=q.trim();if(!q||busy)return;
 var c=chats.filter(function(x){return x.id===cur})[0];
 if(!c){c={id:"c"+Date.now(),title:q.slice(0,42),msgs:[]};chats.unshift(c);cur=c.id;$("sq").value=""}
 c.msgs.push({role:"user",text:q});busy=true;$("send").disabled=true;$("inp").value="";grow();animFrom=c.msgs.length-1;
 renderHist();renderChat();
 $("chat").insertAdjacentHTML("beforeend",'<div class="msg b in" id="typing"><div class="bub"><span class="dots"><i></i><i></i><i></i></span><span>'+esc(t("thinking"))+'</span></div></div>');
 $("scroll").scrollTo({top:$("scroll").scrollHeight,behavior:"smooth"});
 var done=function(r){var ty=$("typing");if(ty)ty.remove();var lu=c.msgs[c.msgs.length-1];if(lu&&lu.role==="user"){lu.text=r.mq||localMask(lu.text);if(c.msgs.length===1&&!c.custom)c.title=lu.text.slice(0,42)}delete r.mq;r.role="bot";c.msgs.push(r);animFrom=c.msgs.length-1;busy=false;$("send").disabled=false;save();renderChat();$("inp").focus()};
 var hist=c.msgs.slice(0,-1).map(function(m){return {role:m.role,text:m.text||""}});
 if(API_URL){
  fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q,lang:lang,history:hist})})
   .then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(d){done({text:d.answer||"",src:d.sources||[],mq:d.masked_question})})
   .catch(function(e){done({key:e===429?"busy":"err"})});
 }else done({key:"err"});
}
function grow(){var i=$("inp");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,140)+"px"}
function closeSide(){$("side").classList.remove("open");$("mask").classList.remove("open")}
function startRename(id){
 var row=document.querySelector('.h[data-id="'+id+'"]'),c=chats.filter(function(x){return x.id===id})[0];if(!row||!c)return;
 var inp=document.createElement("input"),fin0=false;inp.className="ed";inp.maxLength=60;inp.value=c.title||"";
 row.innerHTML="";row.appendChild(inp);inp.focus();inp.select();
 function fin(ok){if(fin0)return;fin0=true;if(ok){var v=localMask(inp.value.trim());if(v){c.title=v.slice(0,60);c.custom=true;save()}}renderHist()}
 inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing){e.preventDefault();fin(true)}else if(e.key==="Escape"){fin(false)}});
 inp.addEventListener("blur",function(){fin(true)});
}
$("hist").ondblclick=function(e){var h=e.target.closest("[data-id]");if(h&&!e.target.closest(".ed")&&!e.target.closest(".acts"))startRename(h.dataset.id)};
$("send").onclick=function(){ask($("inp").value)};
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask($("inp").value)}});
$("inp").addEventListener("input",grow);
function setL(l){lang=l;save();applyLang()}$("lvi").onclick=function(){setL("vi")};$("len").onclick=function(){setL("en")};
function isDark(){var d=document.documentElement,a=d.getAttribute("data-theme");return a==="dark"||(!a&&matchMedia("(prefers-color-scheme:dark)").matches)}
function thLabel(){$("theme").title=isDark()?t("light"):t("dark")}
$("theme").onclick=function(){var n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("oh_theme",n)}catch(e){}thLabel()};
$("newBtn").onclick=function(){cur=null;$("sq").value="";renderHist();renderChat();closeSide();$("inp").focus()};
function toggleMenu(){
 if(matchMedia("(max-width:760px)").matches){var o=$("side").classList.toggle("open");$("mask").classList.toggle("open",o);return}
 var c=document.querySelector(".app").classList.toggle("collapsed");try{localStorage.setItem("oh_side",c?"0":"1")}catch(e){}
}
$("burger").onclick=toggleMenu;$("burgerIn").onclick=toggleMenu;
$("mask").onclick=closeSide;
$("sq").addEventListener("input",renderHist);
$("hist").onclick=function(e){
 if(e.target.closest(".ed"))return;
 var r=e.target.closest("[data-ren]");if(r){startRename(r.dataset.ren);return}
 var d=e.target.closest("[data-del]");
 if(d){chats=chats.filter(function(c){return c.id!==d.dataset.del});if(cur===d.dataset.del)cur=null;save();renderHist();renderChat();return}
 var h=e.target.closest("[data-id]");if(h){cur=h.dataset.id;renderHist();renderChat();closeSide()}
};
$("chat").onclick=function(e){
 var q=e.target.closest("[data-q]");if(q){ask(q.dataset.q);return}
 if(e.target.closest("#ref")){pOff=(pOff+3)%P.length;renderChat()}
};
load();applyLang();try{if(localStorage.getItem("oh_side")==="0")document.querySelector(".app").classList.add("collapsed")}catch(e){}
</script>
</body>
</html>
